configuration:
  device_path:
    name: Путь к модему
    description: Стабильный путь к последовательному порту GSM-модема
  modem_baud_rate:
    name: Скорость модема
    description: Фиксированная скорость порта или auto для автоопределения Gammu
  pin:
    name: PIN-код SIM
    description: Оставьте пустым, если SIM-карта не требует PIN-код
  username:
    name: Пользователь API
    description: Имя пользователя для HTTP Basic-аутентификации
  password:
    name: Пароль API
    description: Пароль для HTTP Basic-аутентификации
  poll_interval:
    name: Интервал проверки SMS
    description: Интервал между проверками физических сообщений в секундах
  message_retention_days:
    name: Хранение очереди
    description: Сколько дней хранить подтверждённые сообщения для дедупликации
