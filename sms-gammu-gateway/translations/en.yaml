configuration:
  device_path:
    name: Device path
    description: Stable serial path to the GSM modem
  modem_baud_rate:
    name: Modem baud rate
    description: Fixed serial speed, or auto for Gammu detection
  pin:
    name: SIM PIN
    description: Leave empty when the SIM does not require a PIN
  username:
    name: API username
    description: HTTP Basic authentication username
  password:
    name: API password
    description: HTTP Basic authentication password
  poll_interval:
    name: SMS poll interval
    description: Seconds between physical modem checks
  voice_call_enabled:
    name: Voice calls
    description: Allow REST endpoints to dial and hang up calls
  message_retention_days:
    name: Queue retention
    description: Days to retain acknowledged messages for deduplication
